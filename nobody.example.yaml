# Example organisation for Nobody Inc.
# Copy it to nobody.yaml, set project_dir, then start the daemon.

# Repository the agents work in. It must already be trusted in Claude Code
# (open it once with `claude` and accept the trust prompt).
project_dir: /path/to/your/project

teams:
  - id: specs
    goal: Turn the requirement into clear technical and functional specs.
    agents:
      - name: archi
        role: Software architect
        prompt: |
          You design the solution: components, data model, API contracts.
          Keep decisions short and justified.

  - id: dev
    goal: Implement the specs with unit tests.
    agents:
      - name: dev1
        role: Go developer
        prompt: |
          You implement what the specs describe. When something is unclear,
          ask the specs team before guessing.

# One-way channels: "from" may start conversations with "to".
# Here dev can question specs; specs can only answer.
channels:
  - from: dev
    to: specs
