openapi: 3.1.0
info:
  title: Nobody Inc daemon API
  version: 0.1.0
  license:
    name: MIT
    url: https://github.com/qwackididuck/nobodyinc/blob/main/LICENSE
  description: |
    HTTP API of nobodyd (ADR-0014, docs/projects.md). `nobodyd` is a
    **launcher**: it listens on 127.0.0.1:7420, serves the routes tagged
    `launcher` (known projects, folders, windows holding projects) and starts
    one **project daemon** per open project, a child process on a port of its
    own. Every other route belongs to a project daemon: the control room
    reaches them through the launcher, `/p/{project}/api/...` being proxied to
    the project daemon's `/api/...` (REST, event stream and terminal
    WebSockets alike); the launcher answers 503 while the project is not
    running. Agents (nobody-hook, MCP) talk to their project daemon directly.
    The launcher also serves the control room itself (its static export) at
    `/`, so that the page and the API share one origin (ADR-0016).

    The project daemon's API has these audiences:
    - `/api/*` is used by the supervision web UI and the human operator;
    - `/internal/*` is used by nobody-hook, the binary Claude Code runs on hook
      events (see docs/hooks.md). It is not meant to be called by hand.
    - `/mcp/{address}` (not described here) is the MCP endpoint (streamable
      HTTP, stateless) of the agent with that address: tools send_message and
      list_contacts, see internal/officemcp.
    Changes are pushed to the UI by `GET /api/events` (Server-Sent Events,
    docs/events.md); the UI then reads the changed resource again.
    The daemon listens on loopback only by default.
servers:
  - url: http://127.0.0.1:7420
    description: The launcher; a project daemon's routes are under /p/{project}

# No authentication: the daemon listens on loopback only by default, and
# refuses cross-site browser requests (docs/architecture.md).
security: []

tags:
  - name: launcher
    description: Served by the launcher itself (ADR-0014).

paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness probe (the launcher's, and each project daemon's)
      responses:
        "200":
          description: Daemon is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /api/projects:
    get:
      operationId: listProjects
      tags: [launcher]
      summary: List the known projects, most recently opened first
      responses:
        "200":
          description: Projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: openProject
      tags: [launcher]
      summary: Make a folder a known project, setting it up if needed
      description: |
        Adds the folder to the known projects. A folder without `.nobody/` is
        set up first: `.nobody/` with its director and no team, the user's
        catalog and settings if missing, and Claude Code's trust of the
        folder. With `create`, the folder must not exist: it is created (its
        parent must exist), made a git repository with an empty first commit,
        then set up. Opening a known project changes nothing. The project
        does not start: a window starts it by holding it (attach).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [path]
              properties:
                path:
                  type: string
                  description: Absolute path of the folder.
                create:
                  type: boolean
                  description: Create a new folder rather than open an existing one.
      responses:
        "200":
          description: The folder was already a Nobody Inc project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "201":
          description: The folder was set up (and created, with `create`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /api/projects/{project}:
    delete:
      operationId: deleteProject
      tags: [launcher]
      summary: Remove Nobody Inc from a project, never its code
      description: |
        Stops the project, then removes its `.nobody/`, its state directory
        (database, worktrees) and its registry entry. Git branches stay,
        `nobody/*` included. Refused (409) while another window holds the
        project; the window that holds it may delete it by giving its
        `window` id, and loses it.

        A feature that is not finished stops the deletion (409, with
        `feature`) unless `feature` says what to do with it: `merge` finishes
        it anyway (ADR-0007, unfinished tickets canceled, local merge into the
        base branch; on a conflict or a refusal nothing is deleted, 409), or
        `discard` removes the teams' worktrees, their uncommitted changes
        lost, and keeps every branch.
      parameters:
        - $ref: "#/components/parameters/Project"
        - name: window
          in: query
          description: The window deleting the project, when it holds it.
          schema:
            type: string
        - name: feature
          in: query
          description: What to do with a feature that is not finished.
          schema:
            type: string
            enum: [merge, discard]
      responses:
        "204":
          description: Nobody Inc removed from the project
        "404":
          $ref: "#/components/responses/Error"
        "409":
          description: Held by another window, a feature is not finished, or the merge failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteRefusal"

  /api/projects/{project}/attach:
    get:
      operationId: attachProject
      tags: [launcher]
      summary: Hold a project from a window (WebSocket)
      description: |
        A window shows one project and holds it while this WebSocket is
        open; holding a project starts its daemon (ADR-0014). One window
        holds a project at most.

        The launcher sends JSON messages:
        - `{"type": "state", "state": "starting" | "running" | "stopped", "error"?: string}`:
          the project daemon's state (`stopped` with `error` when it exited
          unexpectedly or failed to start; the window may attach again);
        - `{"type": "held", "focused"?: true}` then closes with code 4409:
          another window holds the project. Attach again with
          `takeover=true` to take it. In the desktop app, `focused` says the
          app brought the window holding it to the front instead: the
          window that asked goes back to the projects page (ADR-0016);
        - `{"type": "taken"}` then closes with code 4409: another window
          took the project over.
        The window may send `{"type": "release"}`: the project stops at once,
        without the grace period (switching project in the window); and
        `{"type": "start"}` to start the project again after it stopped on
        its own.

        When the connection drops, the project keeps running for a grace
        period (15 s): the same window attaching again within it keeps it,
        and another window may take it without `takeover`. After it, the
        project daemon is stopped. The launcher pings every 10 s.
      parameters:
        - $ref: "#/components/parameters/Project"
        - name: window
          in: query
          required: true
          description: The window's id, kept by the window across reconnections.
          schema:
            type: string
        - name: takeover
          in: query
          description: Take the project from the window that holds it.
          schema:
            type: boolean
      responses:
        "101":
          description: WebSocket established
        "404":
          $ref: "#/components/responses/Error"

  /api/windows:
    post:
      operationId: openWindow
      tags: [launcher]
      summary: Open a new window of the desktop app
      description: |
        Served only by the desktop app's launcher (ADR-0016): a web view has
        no browser tabs, so "open in a new window" asks the app. Without
        `project`, the window shows the projects page. Elsewhere, 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                project:
                  type: string
                  description: The project the window opens; none for the projects page.
      responses:
        "204":
          description: The window is opening
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/fs/dirs:
    get:
      operationId: listDirectories
      tags: [launcher]
      summary: List the sub-folders of a folder, to choose a project
      description: |
        Names of the sub-folders only, hidden ones left out; nothing is read
        inside files. Without `path`, the user's home directory.
      parameters:
        - name: path
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Sub-folders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectoryListing"
        "400":
          $ref: "#/components/responses/Error"

  /api/update:
    get:
      operationId: getUpdate
      tags: [launcher]
      summary: What the launcher knows about newer releases
      description: |
        The result of the last check against GitHub's latest release: the one
        made when the launcher started (unless `check_updates: false` in
        settings.yaml), or the last `POST /api/update/check`. Before any
        check, `checked_at` is absent and `available` is false.
      responses:
        "200":
          description: The last check's result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateStatus"

  /api/update/check:
    post:
      operationId: checkUpdate
      tags: [launcher]
      summary: Look for a newer release now
      description: |
        Asks GitHub for the latest release (anonymous, nothing about the user
        is sent), whatever `check_updates` says, and returns the result. A
        failed check is not an HTTP error: it is reported in `error`.
      responses:
        "200":
          description: The check's result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateStatus"

  /api/agents:
    get:
      operationId: listAgents
      summary: List the agents of the organisation with their current status
      responses:
        "200":
          description: Agents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Agent"

  /api/agents/{address}/start:
    post:
      operationId: startAgent
      summary: Launch (or relaunch) an agent's Claude Code session
      description: 409 when the agent is already running, is on leave, or the daemon is shutting down.
      parameters:
        - $ref: "#/components/parameters/Address"
      responses:
        "202":
          description: Agent launched
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /api/agents/{address}:
    delete:
      operationId: dismissAgent
      summary: Dismiss an agent
      description: |
        Deletes the agent's file. Once idle (or at once with now=true) the agent
        stops; its ticket in progress goes back to its team's queue and its
        undelivered mail is returned to the senders. History is kept. The
        director cannot be dismissed (409): it is always present; edit it
        instead.
      parameters:
        - $ref: "#/components/parameters/Address"
        - $ref: "#/components/parameters/Now"
      responses:
        "202":
          description: Dismissal recorded; applied once the agent is idle
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /api/agents/{address}/definition:
    get:
      operationId: getAgentDefinition
      summary: The agent's definition, as in its file
      parameters:
        - $ref: "#/components/parameters/Address"
      responses:
        "200":
          description: Definition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentDefinition"
        "404":
          $ref: "#/components/responses/Error"
    put:
      operationId: editAgentDefinition
      summary: Replace the agent's definition and restart it with it
      description: |
        Rewrites the agent's file (from and on_leave are kept as they are). The
        agent restarts once idle, resuming its session unless fresh=true. The
        template it came from is never changed.
      parameters:
        - $ref: "#/components/parameters/Address"
        - $ref: "#/components/parameters/Fresh"
        - $ref: "#/components/parameters/Now"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentDefinition"
      responses:
        "200":
          description: Saved; the restart is applied once the agent is idle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentDefinition"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/agents/{address}/leave:
    post:
      operationId: putAgentOnLeave
      summary: Put an agent on leave
      description: |
        The agent stops once idle; its file and session are kept. Its ticket in
        progress goes back to its team's queue, team addressing skips it, and
        mail sent to it waits until it returns. The director cannot go on
        leave: it is always present (409).
      parameters:
        - $ref: "#/components/parameters/Address"
        - $ref: "#/components/parameters/Now"
      responses:
        "202":
          description: Leave recorded; applied once the agent is idle
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /api/agents/{address}/return:
    post:
      operationId: returnAgentFromLeave
      summary: Bring an agent back from leave
      description: The agent starts again, resuming its session; mail that waited is delivered.
      parameters:
        - $ref: "#/components/parameters/Address"
        - $ref: "#/components/parameters/Fresh"
        - $ref: "#/components/parameters/Now"
      responses:
        "202":
          description: Agent restarting
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/teams:
    get:
      operationId: listTeams
      summary: Teams declared in the project's .nobody/org.yaml, including those without agents
      responses:
        "200":
          description: Teams
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Team"
    post:
      operationId: createTeam
      summary: Create a team (a room of the office) with its goal and shared prompt
      description: |
        Adds the team to .nobody/org.yaml and writes its shared prompt to
        .nobody/teams/<id>/TEAM.md (docs/agents.md, "Prompts"). An empty
        prompt means the goal alone. The team has no agent yet: recruit some.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Team"
      responses:
        "201":
          description: Team created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /api/teams/{team}:
    put:
      operationId: updateTeam
      summary: Change a team's goal, shared prompt and block list
      description: |
        goal and prompt are replaced (absent means empty). When they change,
        the team's agents restart with a fresh session once their current
        turn is over: a resumed session keeps the prompt it started with.
        block replaces the team's block list when present, and is left as it
        is when absent; changing it restarts nobody (ADR-0009).
      parameters:
        - name: team
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                goal:
                  type: string
                prompt:
                  type: string
                block:
                  $ref: "#/components/schemas/TeamBlock"
      responses:
        "200":
          description: Team after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteTeam
      summary: Delete a team and dismiss its members
      description: |
        Removes the team from .nobody/org.yaml and from the other teams' block
        lists, and deletes .nobody/teams/<id>/ (its agents' files and
        TEAM.md). Every member is
        dismissed: each stops once its current turn is over (or at once with
        now=true), its ticket in progress goes back to open, and its
        undelivered mail is returned to the senders. The team's tickets stay,
        open ones included, for the human to delete or keep. History is kept.
      parameters:
        - name: team
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/Now"
      responses:
        "202":
          description: Team deleted; its members stop once idle
        "404":
          $ref: "#/components/responses/Error"

  /api/project:
    get:
      operationId: getProject
      summary: The project's shared prompt (.nobody/project.md), given to every agent
      responses:
        "200":
          description: The project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectPrompt"
    put:
      operationId: updateProject
      summary: Change the project's shared prompt
      description: Every agent restarts with a fresh session once its current turn is over.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectPrompt"
      responses:
        "200":
          description: The project after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectPrompt"
        "400":
          $ref: "#/components/responses/Error"

  /api/teams/{team}/agents:
    post:
      operationId: recruitAgent
      summary: Recruit an agent from a template, or create one from a definition, and start it
      parameters:
        - name: team
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Recruitment"
      responses:
        "201":
          description: Agent recruited and starting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /api/catalog:
    get:
      operationId: listTemplates
      summary: Agent templates, built-in and the user's (~/.nobody/catalog), by name
      responses:
        "200":
          description: Templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Template"
        "500":
          $ref: "#/components/responses/Error"

  /api/catalog/{name}:
    get:
      operationId: getTemplate
      summary: One template
      parameters:
        - $ref: "#/components/parameters/TemplateName"
      responses:
        "200":
          description: Template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        "404":
          $ref: "#/components/responses/Error"
    put:
      operationId: saveTemplate
      summary: Create or replace a user template in ~/.nobody/catalog
      description: Saving under the name of a built-in template overrides it. Agents already recruited are not changed.
      parameters:
        - $ref: "#/components/parameters/TemplateName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentDefinition"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        "400":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteTemplate
      summary: Delete a user template from ~/.nobody/catalog
      description: |
        Deleting a template that overrides a built-in one brings the built-in
        one back. Built-in templates cannot be deleted. Agents recruited from
        the template are not changed.
      parameters:
        - $ref: "#/components/parameters/TemplateName"
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /api/agents/{address}/terminal:
    get:
      operationId: attachTerminal
      summary: WebSocket streaming the agent's terminal
      description: |
        Upgrades to a WebSocket. Server → browser binary frames carry raw
        terminal output (recent backlog first). Browser → server text frames
        are JSON controls: {"type":"input","data":"..."} or
        {"type":"resize","rows":40,"cols":120}.
      parameters:
        - $ref: "#/components/parameters/Address"
      responses:
        "101":
          description: Switching to the WebSocket protocol
        "404":
          description: Agent is not running

  /api/shells:
    get:
      operationId: listShells
      summary: The plain terminals open in the project
      description: |
        A shell is the user's own shell, started in the project's folder, with
        no agent behind it (ADR-0021). Oldest first. They live as long as the
        project's daemon: reloading the control room finds them again.
      responses:
        "200":
          description: The open shells
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Shell"
    post:
      operationId: openShell
      summary: Open a shell
      description: 409 when too many shells are open (8) or the daemon is shutting down.
      responses:
        "201":
          description: The new shell
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shell"
        "409":
          $ref: "#/components/responses/Error"

  /api/shells/{id}:
    delete:
      operationId: closeShell
      summary: Close a shell
      description: The shell gets a hangup, like a closed terminal window, and is killed if it stays.
      parameters:
        - $ref: "#/components/parameters/ShellID"
      responses:
        "204":
          description: Shell closed
        "404":
          $ref: "#/components/responses/Error"

  /api/shells/{id}/terminal:
    get:
      operationId: attachShell
      summary: WebSocket streaming a shell's terminal
      description: |
        Same protocol as an agent's terminal (attachTerminal). The server
        closes the connection when the shell ends, and the shell is then gone
        from the list.
      parameters:
        - $ref: "#/components/parameters/ShellID"
      responses:
        "101":
          description: Switching to the WebSocket protocol
        "404":
          $ref: "#/components/responses/Error"

  /api/messages:
    get:
      operationId: listMessages
      summary: Latest messages, oldest first
      description: |
        Without filter: the latest messages of the whole organisation.
        `with` and `scope` narrow the list; they cannot be combined.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: with
          in: query
          description: |
            Only the conversation between the human and this address (both
            directions): what the control room shows as the agent's chat.
          schema:
            type: string
        - name: scope
          in: query
          description: |
            `agents`: only delivered messages between agents (the director
            included), neither from nor to the human or the system address
            `nobody`. The control room shows them in its wastebasket.
          schema:
            type: string
            enum: [agents]
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
    post:
      operationId: sendMessageAsHuman
      summary: Send a message as the human operator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HumanDraft"
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteFinishedAgentConversations
      summary: Delete the finished conversations between agents (empty the wastebasket)
      description: |
        Deletes for good the conversations exchanged only between agents (the
        director included; never one involving the human or `nobody`) that
        are finished: every message is delivered and the last one expects no
        answer (inform, agree, refuse, done). Open conversations stay. The
        deleted messages also disappear from the tickets they were attached
        to. `scope=agents` is required.
      parameters:
        - name: scope
          in: query
          required: true
          schema:
            type: string
            enum: [agents]
      responses:
        "200":
          description: IDs of the deleted messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagesDeleted"
        "400":
          $ref: "#/components/responses/Error"

  /api/events:
    get:
      operationId: streamEvents
      summary: Server-Sent Events announcing changes
      description: |
        A long-lived `text/event-stream` (docs/events.md). Each event names
        what changed; the UI reads that resource again through the REST API,
        which stays the source of truth. A few events carry data for the
        office animations (`agent.status`, `message.sent`).

        There is no replay: the first event of every connection is `hello`,
        after which the client reloads everything. A comment line (`: ping`)
        is sent every 15 seconds so that idle proxies keep the connection.

        Event types and their `data` (JSON):
        - `hello`: `{}`
        - `agent.status`: AgentStatusEvent
        - `message.sent`: Message
        - `message.delivered`: MessagesDeliveredEvent
        - `messages.deleted`: MessagesDeleted (the wastebasket was emptied)
        - `approvals.changed`: `{}`
        - `automation.changed`: `{}` (the automatic mode was switched; read `GET /api/automation`)
        - `tickets.changed`: ChangedEvent (ticket ID)
        - `features.changed`: ChangedEvent (feature ID)
        - `org.changed`: `{}` (an agent was recruited, edited, put on leave, brought back or dismissed)
        - `catalog.changed`: `{}`
        - `schedules.changed`: `{}` (a schedule, one of its occurrences or a proposal changed)
        - `spend.changed`: `{}` (agents spent; sent at most once a second, ADR-0013)
        - `budgets.changed`: `{}` (the budgets file, a ticket's or feature's budget, a hold, a budget request or a cap proposal changed)
        - `kb.changed`: KnowledgeChangedEvent (pages of the knowledge base changed, or the knowledge base itself, ADR-0019)
        - `kb.read`: KnowledgeReadEvent (an agent used a knowledge tool, or is about to read or change a file of the knowledge base: the office walks it to the library)
      responses:
        "200":
          description: The event stream, until the client or the daemon closes it
          content:
            text/event-stream:
              schema:
                type: string

  /api/settings:
    get:
      operationId: getSettings
      summary: How this daemon runs, and the user's settings
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
    put:
      operationId: updateSettings
      summary: Change the user's settings (~/.nobody/settings.yaml)
      description: |
        Only `config_protection` can be changed; it applies to the next
        deliveries at once. The other values are launch options of the daemon.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsUpdate"
      responses:
        "200":
          description: Settings after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "400":
          $ref: "#/components/responses/Error"
        "501":
          $ref: "#/components/responses/Error"

  /api/mcp:
    get:
      operationId: listMCPServers
      summary: MCP servers every agent gets, from Claude Code's three scopes
      description: |
        The servers of the project (.mcp.json), of the user on this project
        (local scope) and of the user (user scope), read from Claude Code's
        own files and merged, the project winning on a name conflict
        (ADR-0010). No value is ever returned in clear: only the names of the
        environment variables a server refers to (`${NAME}`) and whether the
        project's variables (ADR-0020) or the daemon's environment set them, the command without its arguments,
        or the URL without its query. The office server `nobody` is not
        listed: every agent gets it.
      responses:
        "200":
          description: Servers, by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MCPServer"
    post:
      operationId: addMCPServer
      summary: Add or replace an MCP server in one of Claude Code's scopes
      description: |
        Written by Claude Code itself (`claude mcp add-json --scope`), in the
        project's main checkout. Every value of env and headers must refer to
        an environment variable (`${GITLAB_TOKEN}`, `Bearer ${TOKEN}`): a
        secret is never written. Every agent restarts once idle, resuming
        its session, to get the new server.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MCPServerInput"
      responses:
        "201":
          description: Server added; the list after the change
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MCPServer"
        "400":
          $ref: "#/components/responses/Error"

  /api/mcp/{name}:
    get:
      operationId: getMCPServer
      summary: One MCP server, to edit it
      description: |
        The server every agent gets under this name (the winning scope), with
        its command, arguments and URL in full: the control room hides them
        until the human reveals them. Env and headers values that refer to
        an environment variable are returned as written (`${GITLAB_TOKEN}`);
        a value written in clear is never returned: it comes back empty and
        is listed in `clear_values`.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MCPServerDetail"
        "404":
          $ref: "#/components/responses/Error"
    put:
      operationId: updateMCPServer
      summary: Change an MCP server in its scope
      description: |
        Replaces the server's transport (type, command, args, url) and its
        env or headers, in the scope it comes from; its other keys (e.g. a
        timeout) are kept. Written by Claude Code itself, like an addition.
        Every env and headers value must refer to an environment variable:
        a value written in clear must be replaced by one. Every agent
        restarts once idle, resuming its session.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope, server]
              additionalProperties: false
              properties:
                scope:
                  $ref: "#/components/schemas/MCPScope"
                server:
                  type: object
                  additionalProperties: true
      responses:
        "200":
          description: Server changed; the list after the change
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MCPServer"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      operationId: removeMCPServer
      summary: Remove an MCP server from one of Claude Code's scopes
      description: |
        Removed by Claude Code itself (`claude mcp remove --scope`). Every
        agent restarts once idle, resuming its session.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: scope
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/MCPScope"
      responses:
        "204":
          description: Server removed
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/mcp/{name}/tools:
    get:
      operationId: listMCPTools
      summary: The tools an MCP server offers
      description: |
        The daemon starts the server (or reaches it), with its environment
        variables expanded from the daemon's environment and the project's
        (ADR-0020; the project's win), asks for its tools
        and stops it. Used to choose the tools an agent does not get
        (mcp_exclude). Fails when a variable it needs is not set, or when the
        server does not answer in time.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Tools, by name
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [name]
                  properties:
                    name:
                      type: string
                    description:
                      type: string
        "404":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"

  /api/env:
    get:
      operationId: listEnv
      summary: The project's environment variables, by name
      description: |
        The variables the agents' processes get on top of the daemon's own
        environment, replacing those of the same name (ADR-0020,
        docs/projectenv.md): the Claude key, the token of an MCP server...
        They are kept in the project's state directory
        (`~/.nobody/projects/<id>/env.yaml`, readable by the user only). A
        value is never returned: only the names.
      responses:
        "200":
          description: Names, sorted
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EnvVariable"
        "501":
          $ref: "#/components/responses/Error"

  /api/env/{name}:
    put:
      operationId: setEnv
      summary: Set a project environment variable
      description: |
        Adds or replaces a variable. Refused: a name that is not a valid
        identifier, a name Nobody Inc sets itself (`NOBODY_*`, `GIT_AUTHOR_*`,
        `GIT_COMMITTER_*`) or removes from agents (the markers of a parent
        Claude Code session, ADR-0003), an empty value. Every agent then
        restarts once idle, resuming its session, to get the new
        environment; no turn is interrupted. The user's shell and the other
        projects are not affected.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z_][A-Za-z0-9_]{0,127}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnvValue"
      responses:
        "200":
          description: Variable set; the names after the change
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EnvVariable"
        "400":
          $ref: "#/components/responses/Error"
        "501":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteEnv
      summary: Remove a project environment variable
      description: Every agent restarts once idle, as for a change.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Variable removed
        "404":
          $ref: "#/components/responses/Error"
        "501":
          $ref: "#/components/responses/Error"

  /api/skills:
    get:
      operationId: listSkills
      summary: Skills every agent gets
      description: |
        The project's skills (.claude/skills of its main checkout), the
        user's personal skills (skills/ of Claude Code's configuration
        directory) and Claude Code's built-in skills (ADR-0011). Every agent
        gets every skill but those its file excludes (skills_exclude). A
        personal skill named like a project skill is shadowed: agents get the
        project's. Built-in skills are discovered by starting claude without
        reaching the API; when that failed, builtin_error says why.
      responses:
        "200":
          description: Skills, by scope then name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillList"

  /api/skills/builtin/refresh:
    post:
      operationId: refreshBuiltinSkills
      summary: Discover Claude Code's built-in skills again
      description: |
        Starts claude with the agents' flags and the API out of reach, reads
        the skills its init event lists, and stops it. Nothing leaves the
        machine and no model is called.
      responses:
        "200":
          description: The list after the refresh
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillList"

  /api/skills/{scope}/{name}:
    parameters:
      - name: scope
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/SkillScope"
      - name: name
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/SkillName"
    get:
      operationId: getSkill
      summary: One project or personal skill, to edit it
      responses:
        "200":
          description: The skill
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillDetail"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    put:
      operationId: saveSkill
      summary: Create or change a project or personal skill
      description: |
        Writes <dir>/<name>/SKILL.md: name and description in its header,
        then the body. The other keys of an existing header are kept as they
        are; the other files of the skill's directory are not touched. A
        project skill must then be committed to reach agents working on a
        feature. A personal skill serves every project, and the user's own
        Claude Code. Agents restart once idle, resuming their session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillInput"
      responses:
        "200":
          description: Skill saved; the list after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillList"
        "400":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteSkill
      summary: Delete a project or personal skill
      description: |
        Removes the skill's whole directory. Agents restart once idle,
        resuming their session.
      responses:
        "204":
          description: Skill deleted
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/skills/personal/{name}/copy-to-project:
    post:
      operationId: copySkillToProject
      summary: Copy a personal skill into the project
      description: |
        Copies the skill's whole directory into the project's .claude/skills.
        The copy then shadows the personal skill for this project's agents;
        each is edited on its own. Refused when the project already has a
        skill of that name.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/SkillName"
      responses:
        "201":
          description: Skill copied; the list after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillList"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /api/commands:
    get:
      operationId: listCommands
      summary: Commands every agent gets
      description: |
        The project's commands (.claude/commands of its main checkout) and
        the user's personal commands (commands/ of Claude Code's
        configuration directory), ADR-0017. Every agent gets every command.
        A command in a sub-directory is named after its path, "/" written
        ":" (front/test.md is front:test). A personal command named like a
        project command is shadowed: agents get the project's. Claude Code's
        built-in commands are not listed.
      responses:
        "200":
          description: Commands, by scope then name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandList"

  /api/commands/{scope}/{name}:
    parameters:
      - name: scope
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/CommandScope"
      - name: name
        in: path
        required: true
        description: |
          The command's name. An existing command keeps the name its file
          gives it; a new one must follow NewCommandName.
        schema:
          type: string
          minLength: 1
    get:
      operationId: getCommand
      summary: One project or personal command, to edit it
      responses:
        "200":
          description: The command
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandDetail"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    put:
      operationId: saveCommand
      summary: Create or change a project or personal command
      description: |
        Writes the command's file: its description in the header (left out
        when empty), then the prompt. The other keys of an existing header
        are kept as they are; an existing command is written where it is (a
        file that is a symbolic link stays one: its target is written). A new
        command goes to <dir>/<name with ":" as "/">.md. A project command
        must then be committed to reach agents working on a feature. A
        personal command serves every project, and the user's own Claude
        Code. Agents restart once idle, resuming their session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommandInput"
      responses:
        "200":
          description: Command saved; the list after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandList"
        "400":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteCommand
      summary: Delete a project or personal command
      description: |
        Removes the command's file, and the sub-directories it leaves empty.
        Agents restart once idle, resuming their session.
      responses:
        "204":
          description: Command deleted
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/subagents:
    get:
      operationId: listSubagents
      summary: The project's Claude Code subagents, and the agents they would become
      description: |
        Every subagent file of .claude/agents in the project's main checkout
        (ADR-0018), read at each call, with its status: pending (offered),
        imported (an agent has from: subagent:<name>) or ignored (dismissed
        in org.yaml). A file that cannot be read is listed with its error.
      responses:
        "200":
          description: Subagents, by name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubagentList"

  /api/subagents/import:
    post:
      operationId: importSubagents
      summary: Create teams, import subagents as agents and dismiss others, all or nothing
      description: |
        Checks every choice against the organization with all of them first;
        one refusal writes nothing (400, every refusal listed). Then writes
        org.yaml (new teams, dismissed subagents) and the agent files, with
        from: subagent:<name>, and starts each new agent with a fresh
        session, as a recruit. .claude/agents is never touched.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubagentImport"
      responses:
        "200":
          description: Imported; the list after the import
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubagentList"
        "400":
          $ref: "#/components/responses/Error"

  /api/kb:
    get:
      operationId: getKnowledge
      summary: The knowledge base's settings and overview
      description: |
        The project's knowledge base (ADR-0019, docs/knowledge.md): a folder
        of the project declared in .nobody/org.yaml (`knowledge: {path}`).
        Without one, `path` is empty and nothing else is set. The folder is
        scanned again when the last scan is older than two seconds.
      responses:
        "200":
          description: Settings and overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeOverview"
    put:
      operationId: setKnowledge
      summary: Set the knowledge base up, move it or remove it
      description: |
        Writes `knowledge: {path}` in .nobody/org.yaml (an empty path removes
        the key, never the files). The path is relative to the project; it is
        refused when absolute, with "..", leading out of the project through
        a symbolic link, the project itself, or in .nobody, .claude or .git.
        A folder that does not exist is created, empty. Every agent restarts
        once idle, resuming its session: the knowledge tools of the office MCP
        come and go with the knowledge base.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeSettings"
      responses:
        "200":
          description: Saved; the overview after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeOverview"
        "400":
          $ref: "#/components/responses/Error"
        "501":
          $ref: "#/components/responses/Error"

  /api/kb/tree:
    get:
      operationId: getKnowledgeTree
      summary: The knowledge base as a tree of folders and pages
      description: |
        Folders holding pages first, then pages, each sorted by name; folders
        without any page are left out. Hidden files and folders are skipped.
        404 when the project has no knowledge base.
      responses:
        "200":
          description: The tree
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeTree"
        "404":
          $ref: "#/components/responses/Error"

  /api/kb/pages/{path}:
    get:
      operationId: getKnowledgePage
      summary: One page, rendered, with its links and backlinks
      description: |
        The page's HTML is rendered by the daemon (goldmark, GitHub's
        flavour); raw HTML in the page is not rendered. Links to pages and
        anchors are written `kb:<path>[#anchor]`, images and other files of
        the folder `kb-asset:<path>`, for the control room to turn into
        navigation and into GET /api/kb/assets/{path} URLs. Each link has a
        class: kb-page, kb-asset or kb-external, plus kb-broken when it leads
        to nothing.
      parameters:
        - $ref: "#/components/parameters/KnowledgePath"
      responses:
        "200":
          description: The page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgePage"
        "404":
          $ref: "#/components/responses/Error"

  /api/kb/search:
    get:
      operationId: searchKnowledge
      summary: Full-text search of the knowledge base
      description: |
        Every word must be found (accents ignored); the last one may be the
        beginning of a word. Best first: the title weighs more than the body.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
      responses:
        "200":
          description: Results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeSearch"
        "404":
          $ref: "#/components/responses/Error"

  /api/kb/assets/{path}:
    get:
      operationId: getKnowledgeAsset
      summary: An image of the knowledge folder, for a page
      description: |
        Read-only, images only (png, jpg, gif, webp, svg, avif), up to 10 MB,
        under the same path rules as pages (no "..", no hidden file, no
        symbolic link leading out of the folder). Served with a sandboxing
        Content-Security-Policy.
      parameters:
        - $ref: "#/components/parameters/KnowledgePath"
      responses:
        "200":
          description: The image
          content:
            image/*:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/Error"
        "415":
          $ref: "#/components/responses/Error"

  /api/commands/personal/{name}/copy-to-project:
    post:
      operationId: copyCommandToProject
      summary: Copy a personal command into the project
      description: |
        Copies the command's file into the project's .claude/commands, at the
        same path. The copy then shadows the personal command for this
        project's agents; each is edited on its own. Refused when the project
        already has a command of that name.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/NewCommandName"
      responses:
        "201":
          description: Command copied; the list after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandList"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /api/features:
    get:
      operationId: listFeatures
      summary: Features, oldest first (proposed, started and refused); at most one is active
      responses:
        "200":
          description: Features
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Feature"
    post:
      operationId: startFeature
      summary: Start a feature and make it the active one
      description: |
        Creates the feature branch (nobody/<slug>) from the base branch and one
        worktree per team, then restarts every agent in its team's worktree.
        New tickets belong to the active feature. See docs/workspaces.md.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeatureDraft"
      responses:
        "201":
          description: Feature started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feature"
        "400":
          $ref: "#/components/responses/Error"

  /api/features/{id}/start:
    post:
      operationId: startProposedFeature
      summary: Start a feature the director proposed
      description: |
        Prepares its branch and worktrees, makes it the active feature and
        restarts the team agents in their worktrees (not the director). The
        director gets an "agree" answer to its proposal.

        The body may set the feature's budget (ADR-0013): it replaces the
        budget the director proposed; without a body, the proposed budget is
        kept. A budget is refused while budgets are turned off.
      parameters:
        - $ref: "#/components/parameters/FeatureID"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudgetFields"
      responses:
        "200":
          description: Feature started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feature"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /api/features/{id}/refuse:
    post:
      operationId: refuseProposedFeature
      summary: Refuse a feature the director proposed
      description: The director gets a "refuse" answer to its proposal, with the reason.
      parameters:
        - $ref: "#/components/parameters/FeatureID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason:
                  type: string
      responses:
        "200":
          description: Feature refused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feature"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /api/features/{id}/review:
    get:
      operationId: reviewFeature
      summary: What a started feature brings compared with its base branch
      description: |
        The commits of the feature branch that the base branch does not have,
        the files they change (with lines added and deleted), the diff (cut
        at 400 KB, then `diff_truncated` is true), and the feature's tickets
        that are not done or canceled yet. Read-only (docs/workspaces.md).
      parameters:
        - $ref: "#/components/parameters/FeatureID"
      responses:
        "200":
          description: The review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeatureReview"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /api/features/{id}/finish:
    post:
      operationId: finishFeature
      summary: Merge the active feature into its base branch, locally, and end it
      description: |
        Only the human finishes a feature (ADR-0007). The feature branch is
        merged into the base branch with a merge commit, in the project's
        checkout when the base branch is checked out there (it must have no
        uncommitted changes to tracked files), or in a temporary worktree
        otherwise. Nothing is pushed. Then the feature is finished and no
        longer active: team agents restart in the project directory, and the
        teams' worktrees and branches are removed (the feature branch is
        kept). The feature's tickets are archived: they leave the Kanban and
        stay readable (`GET /api/tickets?archived=true`). On a conflict nothing
        changes.

        While some of its tickets are not done or canceled, the finish is
        refused unless `force` is true: they are then canceled (and archived),
        and the work they did not deliver is lost.
      parameters:
        - $ref: "#/components/parameters/FeatureID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                force:
                  type: boolean
                  description: Finish even though some tickets are not done.
      responses:
        "200":
          description: Feature finished
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feature"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          description: Not active, unfinished tickets, uncommitted changes on the base branch, or a merge conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/schedules:
    get:
      operationId: listSchedules
      summary: Scheduled tasks, in the order of .nobody/schedules.yaml
      description: |
        Recurring work the daemon hands to agents while it runs (ADR-0012,
        docs/schedules.md). Each schedule comes with its next occurrence, its
        last one, and a warning when its target uses the `default`
        permission profile.
      responses:
        "200":
          description: Schedules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScheduleView"
    post:
      operationId: createSchedule
      summary: Create a schedule (enabled)
      description: Written to .nobody/schedules.yaml, to be committed by the human.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Schedule"
      responses:
        "201":
          description: Schedule created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleView"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /api/schedules/preview:
    post:
      operationId: previewScheduleRecurrence
      summary: The next occurrences of a recurrence, while the human types it
      description: |
        Checks `every` or `cron` (exactly one) and returns the next three
        occurrences from now, as a schedule created now would have them.
        Nothing is saved.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                every:
                  type: string
                cron:
                  type: string
      responses:
        "200":
          description: The next occurrences
          content:
            application/json:
              schema:
                type: object
                required: [next]
                properties:
                  next:
                    type: array
                    items:
                      type: string
                      format: date-time
        "400":
          $ref: "#/components/responses/Error"

  /api/schedules/{id}:
    parameters:
      - $ref: "#/components/parameters/ScheduleID"
    put:
      operationId: updateSchedule
      summary: Edit a schedule
      description: |
        Replaces the schedule (its id and `enabled` stay as they are; an `id`
        in the body must match the path). The recurrence is armed again from
        now. An occurrence still waiting for a free agent is canceled; one
        already running goes on to its end.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Schedule"
      responses:
        "200":
          description: Schedule edited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleView"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteSchedule
      summary: Delete a schedule; its history stays
      description: An occurrence still waiting is canceled; one already running goes on to its end.
      responses:
        "204":
          description: Schedule deleted
        "404":
          $ref: "#/components/responses/Error"

  /api/schedules/{id}/pause:
    post:
      operationId: pauseSchedule
      summary: Pause a schedule (enabled false)
      description: No new occurrence; an occurrence still waiting is canceled, one already running goes on to its end.
      parameters:
        - $ref: "#/components/parameters/ScheduleID"
      responses:
        "200":
          description: Schedule paused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleView"
        "404":
          $ref: "#/components/responses/Error"

  /api/schedules/{id}/resume:
    post:
      operationId: resumeSchedule
      summary: Resume a paused or disabled schedule, armed from now
      description: Refused (400) when its target no longer exists; edit the target first.
      parameters:
        - $ref: "#/components/parameters/ScheduleID"
      responses:
        "200":
          description: Schedule resumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleView"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/schedules/{id}/run:
    post:
      operationId: runSchedule
      summary: Run one occurrence now ("Run now")
      description: |
        Follows the usual dispatch rules (ADR-0012, point 6): the occurrence
        waits for a free target agent, or is recorded as `unavailable` when
        none of them runs. Works on a paused schedule too. Refused (409)
        while an occurrence of this schedule is waiting or running.
      parameters:
        - $ref: "#/components/parameters/ScheduleID"
      responses:
        "202":
          description: The occurrence, as recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleRun"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /api/schedule-runs:
    get:
      operationId: listScheduleRuns
      summary: Occurrences of scheduled tasks, newest first
      description: Kept after their schedule is deleted.
      parameters:
        - name: schedule
          in: query
          description: Only this schedule's occurrences.
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: Occurrences
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScheduleRun"
        "400":
          $ref: "#/components/responses/Error"

  /api/schedule-proposals:
    get:
      operationId: listScheduleProposals
      summary: The director's schedule proposals, newest first
      responses:
        "200":
          description: Proposals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScheduleProposal"

  /api/schedule-proposals/{id}/accept:
    post:
      operationId: acceptScheduleProposal
      summary: Accept a schedule the director proposed, possibly edited
      description: |
        Writes the schedule (enabled) to .nobody/schedules.yaml. The body may
        carry the schedule as the human edited it; without it, the proposal
        is accepted as it is. The director gets an "agree" answer.
      parameters:
        - $ref: "#/components/parameters/ScheduleProposalID"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                schedule:
                  $ref: "#/components/schemas/Schedule"
      responses:
        "200":
          description: Proposal accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleProposal"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          description: Already decided, or a schedule with this id exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/schedule-proposals/{id}/refuse:
    post:
      operationId: refuseScheduleProposal
      summary: Refuse a schedule the director proposed
      description: The director gets a "refuse" answer, with the reason.
      parameters:
        - $ref: "#/components/parameters/ScheduleProposalID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason:
                  type: string
      responses:
        "200":
          description: Proposal refused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleProposal"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /api/budgets:
    get:
      operationId: getBudgets
      summary: The project's budget settings and caps (.nobody/budgets.yaml)
      description: |
        The file the daemon alone writes (ADR-0013, point 3): whether budgets
        are on, the project's threshold, and the agent, team and staff caps.
        Ticket and feature budgets live with the tickets and features.
      responses:
        "200":
          description: Budget settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetSettings"
    put:
      operationId: updateBudgets
      summary: Replace the budget settings and caps
      description: |
        Writes .nobody/budgets.yaml. Caps of agents or teams that do not exist
        are refused. Turning budgets off lifts every hold and closes the
        pending requests; spend is still measured.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudgetSettings"
      responses:
        "200":
          description: Settings saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetSettings"
        "400":
          $ref: "#/components/responses/Error"

  /api/spend:
    get:
      operationId: getSpend
      summary: What the agents spent in a month, and where each budget stands
      description: |
        Spend is Claude Code's estimate at list price, in USD, read from the
        agents' statusLine and from urgent forks (ADR-0013, points 1 and 2).
        Totals are for the month asked; each gauge is computed over its own
        budget's period (the current month for a monthly cap, all time for a
        cumulative one).
      parameters:
        - name: month
          in: query
          description: '"YYYY-MM", in the machine''s time zone; defaults to the current month.'
          schema:
            type: string
            pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
            example: 2026-11
      responses:
        "200":
          description: Spend
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpendSummary"
        "400":
          $ref: "#/components/responses/Error"

  /api/budget-requests:
    get:
      operationId: listBudgetRequests
      summary: Budget extension requests, newest first
      parameters:
        - name: open
          in: query
          description: Only the requests not decided or closed yet.
          schema:
            type: boolean
      responses:
        "200":
          description: Requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BudgetRequest"

  /api/budget-requests/{id}/extend:
    post:
      operationId: extendBudget
      summary: Grant an extension; the held agents start again
      description: |
        Only the human decides (ADR-0013, point 5). What the extension changes
        depends on the budget (point 6): a ticket's or feature's budget grows;
        a monthly cap is raised for the current month only; a cumulative cap
        is written to .nobody/budgets.yaml. A ticket extension inside a
        feature with a budget comes out of what is left to allocate, and
        raises the feature's budget by the shortfall. The held agents are
        woken up with a notice from `nobody`; the director is told.
      parameters:
        - $ref: "#/components/parameters/BudgetRequestID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount_usd]
              additionalProperties: false
              properties:
                amount_usd:
                  type: number
                  exclusiveMinimum: 0
      responses:
        "200":
          description: Extension granted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetRequest"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          description: Already decided or closed, or still waiting for its justification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/budget-requests/{id}/refuse:
    post:
      operationId: refuseBudget
      summary: Refuse an extension and choose what happens to each held agent
      description: |
        Every held agent needs an outcome: `cancel` its ticket, `release` the
        ticket to its team's queue, or `hold` (stay on budget hold). An agent
        with no ticket can only be held. With `commit_first`, every held
        agent with a ticket in progress is first released for one short turn,
        with a notice from `nobody` asking it to commit its work in progress,
        comment its ticket and stop; its outcome applies at the end of that
        turn, and what the turn spends is shown, never stopped (ADR-0013,
        point 5). The director is told.
      parameters:
        - $ref: "#/components/parameters/BudgetRequestID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudgetRefusal"
      responses:
        "200":
          description: Extension refused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetRequest"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /api/budget-proposals:
    get:
      operationId: listBudgetProposals
      summary: The director's cap proposals, newest first
      responses:
        "200":
          description: Proposals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BudgetProposal"

  /api/budget-proposals/{id}/accept:
    post:
      operationId: acceptBudgetProposal
      summary: Accept a cap the director proposed, possibly edited
      description: |
        Writes the cap to .nobody/budgets.yaml (ADR-0013, point 8). The body
        may carry the cap as the human edited it; without it, the proposal is
        accepted as it is. The director gets an "agree" answer.
      parameters:
        - $ref: "#/components/parameters/BudgetProposalID"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                cap:
                  $ref: "#/components/schemas/BudgetCap"
      responses:
        "200":
          description: Proposal accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetProposal"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          description: Already decided, its agent or team is gone, or budgets are turned off
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/budget-proposals/{id}/refuse:
    post:
      operationId: refuseBudgetProposal
      summary: Refuse a cap the director proposed
      description: The director gets a "refuse" answer, with the reason.
      parameters:
        - $ref: "#/components/parameters/BudgetProposalID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason:
                  type: string
      responses:
        "200":
          description: Proposal refused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetProposal"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /api/tickets:
    get:
      operationId: listTickets
      summary: Tickets, oldest first, optionally filtered
      description: |
        Archived tickets (those of finished features, ADR-0007) are left out,
        unless `archived=true`, which lists only them.
      parameters:
        - name: team
          in: query
          schema:
            type: string
        - name: archived
          in: query
          schema:
            type: boolean
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/TicketStatus"
      responses:
        "200":
          description: Tickets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ticket"
    post:
      operationId: createTicketAsHuman
      summary: Create a ticket as the human operator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketDraft"
      responses:
        "201":
          description: Ticket created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "400":
          $ref: "#/components/responses/Error"

  /api/tickets/{id}:
    get:
      operationId: getTicket
      summary: A ticket with its deliverables, comments and messages
      parameters:
        - $ref: "#/components/parameters/TicketID"
      responses:
        "200":
          description: Ticket details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketDetails"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateTicketBudget
      summary: Change a ticket's budget (the human only)
      description: |
        After creation, a ticket's budget changes only through the human or
        an extension (ADR-0013, point 3). `budget_usd: null` removes it,
        which is refused inside a feature that has a budget; a budget larger
        than the feature has left to allocate (plus this ticket's current
        budget) is refused. Refused while budgets are turned off.
      parameters:
        - $ref: "#/components/parameters/TicketID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudgetFields"
      responses:
        "200":
          description: Ticket updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          description: Archived, or the feature has not enough left to allocate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteTicket
      summary: Delete a ticket for good (the Kanban's shredder)
      description: |
        Only the human deletes tickets. The ticket, its comments and its
        deliverables are deleted; messages about it stay, without the link.
        If an agent is working on it, it gets an urgent notice from `nobody`
        to stop. With `cascade=true`, the tickets that depend on it, and the
        ones that depend on those, are deleted too; otherwise they no longer
        wait for it. Archived tickets cannot be deleted.
      parameters:
        - $ref: "#/components/parameters/TicketID"
        - name: cascade
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: IDs of the deleted tickets
          content:
            application/json:
              schema:
                type: object
                required: [ids]
                properties:
                  ids:
                    type: array
                    items:
                      type: string
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /api/tickets/{id}/comments:
    post:
      operationId: commentTicketAsHuman
      summary: Comment on a ticket as the human operator
      parameters:
        - $ref: "#/components/parameters/TicketID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              additionalProperties: false
              properties:
                body:
                  type: string
      responses:
        "201":
          description: Comment added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketComment"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/tickets/{id}/status:
    post:
      operationId: setTicketStatusAsHuman
      summary: Change a ticket's status as the human operator (done, open, canceled)
      parameters:
        - $ref: "#/components/parameters/TicketID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              additionalProperties: false
              properties:
                status:
                  $ref: "#/components/schemas/TicketStatus"
      responses:
        "200":
          description: Updated ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /api/approvals:
    get:
      operationId: listApprovals
      summary: Permission requests of agents waiting for the human, oldest first
      responses:
        "200":
          description: Pending approvals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Approval"

  /api/approvals/{id}:
    post:
      operationId: decideApproval
      summary: Allow or deny a pending permission request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalDecision"
      responses:
        "204":
          description: Decision sent to the agent
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /api/automation:
    get:
      operationId: getAutomation
      summary: The project's automatic mode
      responses:
        "200":
          description: Current level
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Automation"
    put:
      operationId: setAutomation
      summary: Switch the automatic mode
      description: |
        With `auto`, the daemon allows every permission request itself, the
        ones already waiting included; no agent restarts. Claude Code's deny
        rules still win, because it evaluates them before asking. The level is
        kept in the daemon's memory only: it is `off` after a restart.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Automation"
      responses:
        "200":
          description: The new level
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Automation"
        "400":
          $ref: "#/components/responses/Error"
        "501":
          $ref: "#/components/responses/Error"

  /internal/agents/{address}/hook:
    post:
      operationId: handleHookEvent
      summary: Decide what to tell an agent on a Claude Code hook event
      description: |
        Called by nobody-hook with the event JSON received from Claude Code.
        Returns the hook response to print (if any) and the IDs of the messages
        it carries, to acknowledge once printed. For a PermissionRequest event,
        the call blocks until the human decides (up to 9 minutes) and carries
        no message; without a decision, no response is returned and Claude
        Code shows its own prompt in the agent's terminal.
      parameters:
        - $ref: "#/components/parameters/Address"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HookEvent"
      responses:
        "200":
          description: What to tell the agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HookDecision"
        "404":
          $ref: "#/components/responses/Error"

  /internal/agents/{address}/hook/ack:
    post:
      operationId: acknowledgeHookDelivery
      summary: Confirm that a hook response was handed to the agent
      parameters:
        - $ref: "#/components/parameters/Address"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HookAck"
      responses:
        "204":
          description: Messages marked delivered
        "404":
          $ref: "#/components/responses/Error"

  /internal/agents/{address}/statusline:
    post:
      operationId: reportStatusLine
      summary: Record an agent's running cost, as Claude Code's statusLine reports it
      description: |
        Called by `nobody-hook statusline` with the JSON Claude Code hands its
        statusLine (ADR-0013, point 1). The daemon turns the session's running
        total into a spend record: the delta since the previous report of the
        same agent and session, or the total itself when it is lower (a
        resumed or cleared session starts again from 0). Crossing a budget's
        threshold puts the agents it covers on hold.
      parameters:
        - $ref: "#/components/parameters/Address"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusLineReport"
      responses:
        "204":
          description: Recorded
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

components:
  parameters:
    ShellID:
      name: id
      in: path
      required: true
      schema:
        type: string
        example: sh1

    KnowledgePath:
      name: path
      in: path
      required: true
      description: A path in the knowledge folder; it may hold slashes (adr/0003-isolate-agents.md).
      schema:
        type: string
        example: adr/0003-isolate-agents.md

    Project:
      name: project
      in: path
      required: true
      description: Project id, "<folder>-<hash of its path>"
      schema:
        type: string
        example: shop-6e403867

    Address:
      name: address
      in: path
      required: true
      description: Agent address, "<agent>@<team>"
      schema:
        type: string
        example: archi@specs

    TemplateName:
      name: name
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z][a-z0-9-]*$"
        example: dev

    Fresh:
      name: fresh
      in: query
      description: Restart with a new Claude Code session instead of resuming the current one.
      schema:
        type: boolean
        default: false

    Now:
      name: now
      in: query
      description: Apply at once instead of waiting for the end of the agent's current turn.
      schema:
        type: boolean
        default: false

    FeatureID:
      name: id
      in: path
      required: true
      description: Feature ID, "F-<number>"
      schema:
        type: string
        example: F-3

    TicketID:
      name: id
      in: path
      required: true
      description: Ticket ID, "T-<number>"
      schema:
        type: string
        example: T-12

    ScheduleID:
      name: id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ScheduleIDValue"

    ScheduleProposalID:
      name: id
      in: path
      required: true
      description: Proposal ID, "SP-<number>"
      schema:
        type: string
        example: SP-2

    BudgetRequestID:
      name: id
      in: path
      required: true
      description: Request ID, "BR-<number>"
      schema:
        type: string
        example: BR-4

    BudgetProposalID:
      name: id
      in: path
      required: true
      description: Proposal ID, "BP-<number>"
      schema:
        type: string
        example: BP-1

  responses:
    Error:
      description: |
        Request refused. On every route that changes something (anything but
        GET), a browser request from another origin than the control room is
        refused with 403, and a body that is not application/json with 415.
        Agent and catalog routes answer 501 when the organization cannot be
        changed by this daemon, and 500 when a change was saved but could not
        be reloaded or applied (the message says which).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Health:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string

    UpdateStatus:
      type: object
      required: [current, available]
      properties:
        current:
          type: string
          description: This build's version; `dev` or a `git describe` string for a development build, which is never compared.
        latest:
          type: string
          description: Tag of GitHub's latest release, e.g. `v1.4.0`. Absent before a successful check.
        url:
          type: string
          description: The latest release's page.
        available:
          type: boolean
          description: The latest release is newer than `current`.
        checked_at:
          type: string
          format: date-time
          description: When the last check ended. Absent before any check.
        error:
          type: string
          description: Why the last check failed (offline, repository not public yet, rate limit…).

    Project:
      type: object
      required: [id, name, path, missing, git, trusted, held, state]
      properties:
        id:
          type: string
        name:
          type: string
          description: The folder's name.
        path:
          type: string
        missing:
          type: boolean
          description: The folder disappeared (moved or deleted outside Nobody Inc).
        git:
          type: boolean
          description: The folder is a git repository (features need one).
        trusted:
          type: boolean
          description: Claude Code trusts the folder (otherwise agents wait on its trust question).
        held:
          type: boolean
          description: A window holds the project, or held it less than the grace period ago.
        state:
          type: string
          enum: [stopped, starting, running, stopping]
          description: The project daemon's state.
        last_opened:
          type: string
          format: date-time
        created:
          type: boolean
          description: |
            Answer of POST /api/projects only: the folder has just been set
            up. The control room opens it with setup=1, which offers to import
            the project's subagents (ADR-0018).

    DeleteRefusal:
      type: object
      required: [error]
      properties:
        error:
          type: string
        feature:
          description: The feature that is not finished, when that is the reason.
          type: object
          required: [id, title, branch]
          properties:
            id:
              type: string
            title:
              type: string
            branch:
              type: string

    DirectoryListing:
      type: object
      required: [path, home, dirs]
      properties:
        path:
          type: string
        parent:
          type: string
          description: The parent folder; absent at the root.
        home:
          type: string
          description: The user's home directory.
        dirs:
          type: array
          items:
            type: object
            required: [name, path, git, nobody]
            properties:
              name:
                type: string
              path:
                type: string
              git:
                type: boolean
                description: A git repository.
              nobody:
                type: boolean
                description: Has a .nobody/ directory.
              project:
                type: string
                description: The id of the known project in this folder.

    Shell:
      type: object
      required: [id, name, started]
      properties:
        id:
          type: string
          example: sh1
        name:
          type: string
          example: Shell 1
        started:
          type: string
          format: date-time

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

    Agent:
      type: object
      required: [address, team, name, role, status, on_leave, pending_change]
      properties:
        address:
          type: string
          description: '"<agent>@<team>", or the name alone for the director.'
        team:
          type: string
          description: Empty for the director, who has no team.
        name:
          type: string
        role:
          type: string
        expertise:
          type: string
          description: What to ask this agent about, and what it decides.
        status:
          type: string
          enum: [stopped, starting, working, idle, exited, awaiting_approval, budget_hold]
          description: "`budget_hold`: held by a budget at its threshold, session kept, never woken up (ADR-0013, point 4)."
        on_leave:
          type: boolean
        from:
          type: string
          description: Template it was recruited from, "<template>@<version>" (information only).
        pending_change:
          type: boolean
          description: A change waits for the agent to end its turn before it restarts or stops.

    Team:
      type: object
      required: [id]
      properties:
        id:
          type: string
        goal:
          type: string
        prompt:
          type: string
          description: Instructions shared by the team's agents (.nobody/teams/<id>/TEAM.md); empty means the goal alone.
        block:
          $ref: "#/components/schemas/TeamBlock"

    TeamBlock:
      type: array
      uniqueItems: true
      items:
        type: string
      description: |
        Teams this team's members may not start a conversation with, "@team"
        included (ADR-0009). Flows are open by default; a block is one-way,
        never stops an answer nor a ticket, and never applies to the human,
        nobody or the director. Each entry is another existing team. Changing
        it does not restart anyone: the members of both teams get a notice.

    ProjectPrompt:
      type: object
      required: [prompt]
      additionalProperties: false
      properties:
        prompt:
          type: string
          description: Context shared by every agent of the project (.nobody/project.md).

    PermissionProfile:
      type: string
      enum: [default, allowlist, auto]
      description: See docs/agents.md. auto is not available with Haiku models.

    AgentDefinition:
      type: object
      additionalProperties: false
      description: |
        Content of an agent or template file (docs/agents.md). description and
        version are used by templates; from and on_leave by recruited agents,
        and are read-only through the agent endpoints.
      properties:
        description:
          type: string
        version:
          type: integer
          minimum: 0
        role:
          type: string
        expertise:
          type: string
          description: |
            Public, short: what colleagues should ask this agent about, and
            what it decides. Shown to every colleague in the organization chart.
        model:
          type: string
          description: Claude model; empty for Claude Code's default.
        permissions:
          type: object
          additionalProperties: false
          properties:
            profile:
              $ref: "#/components/schemas/PermissionProfile"
            allow:
              type: array
              items: {type: string}
            deny:
              type: array
              items: {type: string}
        tools:
          type: array
          items: {type: string}
        mcp_exclude:
          type: array
          description: |
            MCP servers ("gitlab") or single tools ("gitlab/delete_project")
            the agent does not get. Every agent gets every server of the
            project, of the user on this project and of the user (ADR-0010);
            an exclusion naming a server absent from this machine is ignored.
          items: {type: string}
        skills:
          type: array
          description: |
            Skills preloaded: their content is handed to the agent at every
            session start, by its SessionStart hook (ADR-0011). The agent gets
            every other skill too, to invoke when it needs one.
          items:
            $ref: "#/components/schemas/SkillName"
        skills_exclude:
          type: array
          description: |
            Skills the agent does not get, built-in ones included. An exclusion
            naming a skill absent from this machine is ignored. A skill cannot
            be both preloaded and excluded.
          items:
            $ref: "#/components/schemas/SkillName"
        from:
          type: string
        on_leave:
          type: boolean
        prompt:
          type: string
          description: The agent's own instructions (the markdown body of the file).

    Template:
      allOf:
        - $ref: "#/components/schemas/AgentDefinition"
        - type: object
          required: [name, builtin]
          properties:
            name:
              type: string
            builtin:
              type: boolean
              description: Shipped with Nobody Inc and not overridden by a template in ~/.nobody/catalog.
            overrides_builtin:
              type: boolean
              description: A user template replacing a built-in one; deleting it brings the built-in one back.

    Recruitment:
      type: object
      additionalProperties: false
      required: [name]
      description: Exactly one of template (recruit) and definition (create directly).
      properties:
        name:
          type: string
          pattern: "^[a-z][a-z0-9-]*$"
        template:
          type: string
          description: Template to copy from the catalog.
        definition:
          $ref: "#/components/schemas/AgentDefinition"

    Act:
      type: string
      enum: [request, query, propose, inform, agree, refuse, done]

    Priority:
      type: string
      enum: [normal, urgent]

    Message:
      type: object
      required: [id, conversation, from, to, act, priority, subject, body, hops, sent_at]
      properties:
        id:
          type: string
        conversation:
          type: string
        in_reply_to:
          type: string
        from:
          type: string
        to:
          type: string
        act:
          $ref: "#/components/schemas/Act"
        priority:
          $ref: "#/components/schemas/Priority"
        subject:
          type: string
        body:
          type: string
        hops:
          type: integer
        ticket:
          type: string
        sent_at:
          type: string
          format: date-time
        delivered_at:
          type: string
          format: date-time

    AgentStatusEvent:
      type: object
      required: [address, status]
      properties:
        address:
          type: string
        status:
          type: string
          enum: [stopped, starting, working, idle, exited, awaiting_approval, budget_hold]
          description: "`budget_hold`: held by a budget at its threshold, session kept, never woken up (ADR-0013, point 4)."

    MessagesDeliveredEvent:
      type: object
      required: [recipient, ids]
      properties:
        recipient:
          type: string
        ids:
          type: array
          items:
            type: string

    MessagesDeleted:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          items:
            type: string

    ChangedEvent:
      type: object
      required: [id]
      properties:
        id:
          type: string

    Settings:
      type: object
      required: [project_dir, project_id, state_dir, address, origins, claude_path, start_agents, config_protection]
      properties:
        project_dir:
          type: string
          description: The project, the directory holding .nobody/.
        project_id:
          type: string
        state_dir:
          type: string
          description: This project's data on this machine (database, worktrees); never committed.
        address:
          type: string
          description: Where the daemon listens (NOBODY_ADDR).
        origins:
          type: array
          items:
            type: string
          description: Browser origins allowed to change things through the API (-origins).
        claude_path:
          type: string
        start_agents:
          type: boolean
          description: Whether every agent starts with the daemon (-start).
        config_protection:
          type: string
          enum: [block, warn]
          description: What happens when a delivery changes the project's .nobody/.

    SettingsUpdate:
      type: object
      required: [config_protection]
      additionalProperties: false
      properties:
        config_protection:
          type: string
          enum: [block, warn]

    MCPScope:
      type: string
      enum: [project, local, user]
      description: |
        Claude Code's MCP scopes (ADR-0010): project is .mcp.json, committed
        with the project; local is the user on this project only; user is
        the user on all their projects (both in ~/.claude.json).

    MCPServerInput:
      type: object
      required: [name, scope, server]
      additionalProperties: false
      properties:
        name:
          type: string
          pattern: "^[A-Za-z0-9_-]+$"
          description: The server's name; nobody is reserved for the office server.
        scope:
          $ref: "#/components/schemas/MCPScope"
        server:
          type: object
          description: |
            The server in Claude Code's format: type (stdio, http or sse),
            command and args, or url, and env or headers whose values refer
            to environment variables.
          additionalProperties: true

    MCPServerDetail:
      type: object
      required: [name, source, server, clear_values]
      properties:
        name:
          type: string
        source:
          $ref: "#/components/schemas/MCPScope"
        server:
          type: object
          description: |
            type, command, args, url, and env and headers whose values in
            clear are emptied.
          additionalProperties: true
        clear_values:
          type: array
          description: The env and headers values written in clear, as "env.NAME" or "headers.NAME".
          items:
            type: string

    EnvVariable:
      type: object
      required: [name]
      properties:
        name:
          type: string

    EnvValue:
      type: object
      required: [value]
      additionalProperties: false
      properties:
        value:
          type: string
          minLength: 1
          description: Never returned by the API.

    MCPServer:
      type: object
      required: [name, source, type, target, env, excluded_by]
      properties:
        name:
          type: string
        source:
          $ref: "#/components/schemas/MCPScope"
        type:
          type: string
          description: stdio, http or sse.
        target:
          type: string
          description: The command without its arguments (stdio), or the URL without its query (http, sse).
        env:
          type: array
          description: Environment variables the server refers to as ${NAME}.
          items:
            type: object
            required: [name, set]
            properties:
              name:
                type: string
              set:
                type: boolean
        excluded_by:
          type: array
          description: Addresses of the agents that exclude the whole server (mcp_exclude).
          items:
            type: string

    SkillName:
      type: string
      pattern: "^[a-z0-9][a-z0-9-]{0,63}$"
      description: A skill's name, also the name of its directory.

    SkillScope:
      type: string
      enum: [project, personal]
      description: |
        Where a skill the control room can change lives: project is
        .claude/skills of the project (committed with it); personal is
        skills/ of Claude Code's configuration directory, for all the user's
        projects and their own Claude Code.

    Skill:
      type: object
      required: [name, description, scope, has_hooks]
      properties:
        name:
          $ref: "#/components/schemas/SkillName"
        description:
          type: string
        scope:
          type: string
          enum: [project, personal, builtin]
        has_hooks:
          type: boolean
          description: |
            The skill declares hooks: invoking it asks for permission, so it
            goes to the human's approval queue.
        committed:
          type: boolean
          description: |
            Project skills only: the skill is committed and unchanged. Agents
            working on a feature only see committed skills.
        shadowed:
          type: boolean
          description: "Personal skills only: a project skill has the same name and wins."

    SkillList:
      type: object
      required: [skills]
      properties:
        skills:
          type: array
          items:
            $ref: "#/components/schemas/Skill"
        builtin_error:
          type: string
          description: Why the built-in skills could not be discovered; absent when they were.

    SkillInput:
      type: object
      required: [description, body]
      additionalProperties: false
      properties:
        description:
          type: string
          minLength: 1
          description: What the skill does and when to use it; the model chooses skills from it.
        body:
          type: string
          description: The skill's instructions (the markdown after the header).

    SkillDetail:
      type: object
      required: [name, scope, description, body, other_keys]
      properties:
        name:
          $ref: "#/components/schemas/SkillName"
        scope:
          $ref: "#/components/schemas/SkillScope"
        description:
          type: string
        body:
          type: string
        other_keys:
          type: string
          description: |
            The rest of the header (allowed-tools, hooks...), as YAML, read-only:
            kept as it is when the skill is saved.
        has_hooks:
          type: boolean

    Subagent:
      type: object
      required: [name, file, description, status]
      properties:
        name:
          type: string
          description: The subagent's name, its identity for Claude Code; empty when its file has none.
        file:
          type: string
          description: Its file, relative to the project.
        description:
          type: string
        status:
          type: string
          enum: [pending, imported, ignored]
        imported_as:
          type: string
          description: Imported only, the address of the agent imported from it.
        agent_name:
          type: string
          description: The agent name suggested (its name made valid); empty when none could be made.
        agent:
          $ref: "#/components/schemas/AgentDefinition"
        dropped_tools:
          type: string
          description: |
            Its tools list, not carried over: for a subagent it restricts,
            for an agent it would allow without asking. To set by hand.
        ignored_keys:
          type: array
          items:
            type: string
          description: Header keys not carried over (mcpServers, hooks, maxTurns...).
        error:
          type: string
          description: Why it cannot be imported; absent when it can.

    SubagentList:
      type: object
      required: [subagents]
      properties:
        subagents:
          type: array
          items:
            $ref: "#/components/schemas/Subagent"

    SubagentImport:
      type: object
      additionalProperties: false
      properties:
        teams:
          type: array
          description: New teams.
          items:
            type: object
            additionalProperties: false
            required: [id]
            properties:
              id:
                type: string
                pattern: "^[a-z][a-z0-9-]*$"
              goal:
                type: string
        agents:
          type: array
          description: Subagents to import.
          items:
            type: object
            additionalProperties: false
            required: [subagent, team, name]
            properties:
              subagent:
                type: string
              team:
                type: string
              name:
                type: string
                pattern: "^[a-z][a-z0-9-]*$"
              profile:
                $ref: "#/components/schemas/PermissionProfile"
        ignore:
          type: array
          description: Names of the subagents to dismiss.
          items:
            type: string

    KnowledgeSettings:
      type: object
      additionalProperties: false
      required: [path]
      properties:
        path:
          type: string
          description: The folder, relative to the project ("docs"); empty removes the knowledge base.
          example: docs

    KnowledgeOverview:
      type: object
      required: [path, suggested]
      properties:
        path:
          type: string
          description: The folder declared in org.yaml; empty when the project has no knowledge base.
        suggested:
          type: string
          description: The folder to suggest when setting one up.
          example: docs
        exists:
          type: boolean
          description: False when the declared folder is missing (deleted by hand, another branch).
        error:
          type: string
          description: Why the folder cannot be read (a path the rules refuse...).
        pages:
          type: integer
        home:
          type: string
          description: index.md, else README.md, at the root of the folder; empty when neither exists.
        folders:
          type: array
          description: The top-level folders holding pages.
          items:
            type: object
            required: [path, pages]
            properties:
              path:
                type: string
              pages:
                type: integer
        recent:
          type: array
          description: The pages changed last, newest first.
          items:
            $ref: "#/components/schemas/KnowledgePageRef"
        broken:
          type: array
          items:
            type: object
            required: [page, target, text]
            properties:
              page:
                type: string
              target:
                type: string
                description: The destination as written in the page.
              text:
                type: string
        orphans:
          type: array
          description: Pages no other page links to, the home page aside.
          items:
            $ref: "#/components/schemas/KnowledgePageRef"
        errors:
          type: array
          description: Pages that could not be read (too large, unreadable, a link leading out of the folder).
          items:
            type: object
            required: [path, error]
            properties:
              path:
                type: string
              error:
                type: string

    KnowledgePageRef:
      type: object
      required: [path, title]
      properties:
        path:
          type: string
          example: adr/0003-isolate-agents.md
        title:
          type: string
        modified:
          type: string
          format: date-time

    KnowledgeTree:
      type: object
      required: [path, home, root]
      properties:
        path:
          type: string
        home:
          type: string
        root:
          $ref: "#/components/schemas/KnowledgeNode"

    KnowledgeNode:
      type: object
      required: [name, path, dir]
      properties:
        name:
          type: string
        path:
          type: string
          description: Relative to the knowledge folder; empty for the root.
        dir:
          type: boolean
        title:
          type: string
          description: A page's title.
        error:
          type: string
          description: Why a page could not be read.
        pages:
          type: integer
          description: A folder's number of pages, sub-folders included.
        children:
          type: array
          items:
            $ref: "#/components/schemas/KnowledgeNode"

    KnowledgePage:
      type: object
      required: [path, title, header, html, size, modified, links, backlinks]
      properties:
        path:
          type: string
        title:
          type: string
        header:
          type: array
          description: The page's YAML header, in order.
          items:
            type: object
            required: [key, value]
            properties:
              key:
                type: string
              value:
                type: string
        html:
          type: string
        size:
          type: integer
        modified:
          type: string
          format: date-time
        links:
          type: array
          items:
            $ref: "#/components/schemas/KnowledgeLink"
        backlinks:
          type: array
          items:
            $ref: "#/components/schemas/KnowledgePageRef"

    KnowledgeLink:
      type: object
      required: [target, text, kind, broken]
      properties:
        target:
          type: string
          description: The destination as written.
        text:
          type: string
        kind:
          type: string
          enum: [page, asset, external, anchor]
        path:
          type: string
          description: Where a page or asset link leads in the knowledge folder.
        anchor:
          type: string
        title:
          type: string
          description: The title of the page a page link leads to.
        image:
          type: boolean
        broken:
          type: boolean

    KnowledgeSearch:
      type: object
      required: [query, results]
      properties:
        query:
          type: string
        results:
          type: array
          items:
            type: object
            required: [path, title, snippet]
            properties:
              path:
                type: string
              title:
                type: string
              snippet:
                type: array
                description: A piece of the page's text around the matches.
                items:
                  type: object
                  required: [text]
                  properties:
                    text:
                      type: string
                    match:
                      type: boolean
                      description: True for a word found.

    KnowledgeChangedEvent:
      type: object
      required: [pages, added, removed, changed, reset]
      properties:
        pages:
          type: integer
        added:
          type: integer
        removed:
          type: integer
        changed:
          type: integer
        reset:
          type: boolean
          description: True when the folder itself changed (set up, moved, removed), to reload without announcing new pages.

    KnowledgeReadEvent:
      type: object
      required: [agent, tool, subject]
      properties:
        agent:
          type: string
        tool:
          type: string
          description: |
            A knowledge tool, or a file tool whose PreToolUse hook names a file
            of the knowledge folder (the agent's worktree or the main checkout).
          enum: [kb_search, kb_read, kb_list, Read, Edit, Write, MultiEdit, NotebookEdit]
        subject:
          type: string
          description: The query, the page or the folder; for a file tool, the file's path in the knowledge folder.

    NewCommandName:
      type: string
      pattern: "^[a-z0-9][a-z0-9-]{0,63}(:[a-z0-9][a-z0-9-]{0,63})*$"
      description: |
        The name of a command the control room creates: segments of
        lowercase letters, digits and hyphens, separated by ":" for
        sub-directories (front:test is front/test.md).

    CommandScope:
      type: string
      enum: [project, personal]
      description: |
        Where a command lives: project is .claude/commands of the project
        (committed with it); personal is commands/ of Claude Code's
        configuration directory, for all the user's projects and their own
        Claude Code.

    Command:
      type: object
      required: [name, description, scope]
      properties:
        name:
          type: string
          description: How the command is invoked, without the "/".
        description:
          type: string
          description: Empty when the header has none (Claude Code then shows the prompt's first line).
        argument_hint:
          type: string
          description: The header's argument-hint, absent when there is none.
        allowed_tools:
          type: string
          description: |
            The header's allowed-tools, absent when there is none: tools the
            command lets run without asking while it runs, outside the
            approval queue (ADR-0017).
        scope:
          $ref: "#/components/schemas/CommandScope"
        committed:
          type: boolean
          description: |
            Project commands only: the command is committed and unchanged.
            Agents working on a feature only see committed commands.
        shadowed:
          type: boolean
          description: "Personal commands only: a project command has the same name and wins."

    CommandList:
      type: object
      required: [commands]
      properties:
        commands:
          type: array
          items:
            $ref: "#/components/schemas/Command"

    CommandInput:
      type: object
      required: [description, body]
      additionalProperties: false
      properties:
        description:
          type: string
          description: What the command does; may be empty.
        body:
          type: string
          minLength: 1
          description: The command's prompt (the markdown after the header); $ARGUMENTS stands for its arguments.

    CommandDetail:
      type: object
      required: [name, scope, description, body, other_keys]
      properties:
        name:
          type: string
        scope:
          $ref: "#/components/schemas/CommandScope"
        description:
          type: string
        body:
          type: string
        other_keys:
          type: string
          description: |
            The rest of the header (argument-hint, allowed-tools, model...),
            as YAML, read-only: kept as it is when the command is saved.
        allowed_tools:
          type: string

    HumanDraft:
      type: object
      required: [to, act, priority]
      additionalProperties: false
      properties:
        to:
          type: string
        act:
          $ref: "#/components/schemas/Act"
        priority:
          $ref: "#/components/schemas/Priority"
        subject:
          type: string
        body:
          type: string
        in_reply_to:
          type: string
        ticket:
          type: string

    FeatureReview:
      type: object
      required: [feature, commits, files, diff, diff_truncated, unfinished_tickets]
      properties:
        feature:
          $ref: "#/components/schemas/Feature"
        commits:
          type: array
          items:
            type: object
            required: [hash, author, date, subject]
            properties:
              hash:
                type: string
              author:
                type: string
              date:
                type: string
                format: date-time
              subject:
                type: string
        files:
          type: array
          items:
            type: object
            required: [path, status, added, deleted]
            properties:
              path:
                type: string
              status:
                type: string
                description: A added, M modified, D deleted, R renamed.
              added:
                type: integer
                description: Lines added; -1 for a binary file.
              deleted:
                type: integer
        diff:
          type: string
          description: Unified diff of the feature branch against the base branch (since they diverged).
        diff_truncated:
          type: boolean
        unfinished_tickets:
          type: array
          items:
            $ref: "#/components/schemas/Ticket"

    Feature:
      type: object
      required: [id, title, slug, base_branch, branch, active, status, created_by, created_at]
      properties:
        id:
          type: string
          example: F-1
        title:
          type: string
        description:
          type: string
          description: The need, what is wanted and why.
        acceptance_criteria:
          type: string
        status:
          type: string
          enum: [proposed, started, refused, finished]
          description: The director proposes, the human starts or refuses; a feature the human creates starts at once; the human finishes it by merging it into its base branch.
        merge_commit:
          type: string
          description: The merge commit on the base branch, once finished ("" when there was nothing to merge).
        proposal_message:
          type: string
          description: ID of the "propose" message the director's proposal sent to the human.
        refusal_reason:
          type: string
        slug:
          type: string
        base_branch:
          type: string
        branch:
          type: string
          example: nobody/add-order-api
        active:
          type: boolean
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        budget_usd:
          type: number
          description: The feature's budget; for a proposed feature, the budget the director proposed. Absent when it has none.
        threshold:
          type: integer
          description: Percent of the budget at which its agents stop; absent means the project's threshold.
        spent_usd:
          type: number
          description: What its tickets spent, all time.
        allocated_usd:
          type: number
          description: The budgets of its tickets that are not canceled, plus what its canceled tickets spent. What is left to allocate is budget_usd minus this.

    FeatureDraft:
      type: object
      required: [title]
      additionalProperties: false
      properties:
        title:
          type: string
        description:
          type: string
        base_branch:
          description: Branch the feature starts from; defaults to the project's current branch.
          type: string
        budget_usd:
          type: number
          exclusiveMinimum: 0
        threshold:
          $ref: "#/components/schemas/Threshold"

    ScheduleIDValue:
      type: string
      pattern: "^[a-z0-9][a-z0-9-]{0,63}$"
      example: grafana-watch

    Schedule:
      type: object
      description: |
        A scheduled task, as written in .nobody/schedules.yaml. Exactly one
        of `every` and `cron` is set.
      required: [title, target, mode, instructions]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/ScheduleIDValue"
        title:
          type: string
        every:
          type: string
          description: A Go duration of one minute or more, counted from when the schedule is armed.
          example: 10m
        cron:
          type: string
          description: Five standard fields or a descriptor (`@daily`), in the machine's time zone.
          example: "0 9 * * 1-5"
        target:
          type: string
          description: An agent ("monitor@ops"), a team ("@ops", its first free member) or the director (message mode only).
        mode:
          type: string
          enum: [ticket, message]
          description: "`ticket`: a ticket assigned to the agent, outside any feature; `message`: mail from nobody."
        enabled:
          type: boolean
          readOnly: true
          description: False when paused, or disabled by the daemon because its target is gone.
        instructions:
          type: string

    ScheduleView:
      allOf:
        - $ref: "#/components/schemas/Schedule"
        - type: object
          required: [id, enabled]
          properties:
            next_run:
              type: string
              format: date-time
              description: The next occurrence; absent when not enabled.
            last_run:
              $ref: "#/components/schemas/ScheduleRun"
            warning:
              type: string
              description: E.g. the target uses the `default` permission profile, so its work waits for approvals.

    ScheduleRun:
      type: object
      description: One occurrence of a schedule (ADR-0012, point 8).
      required: [id, schedule_id, schedule_title, trigger, status, due_at]
      properties:
        id:
          type: integer
        schedule_id:
          type: string
        schedule_title:
          type: string
        trigger:
          type: string
          enum: [schedule, manual]
        status:
          type: string
          enum: [waiting, running, done, canceled, skipped, unavailable, interrupted]
        due_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
        agent:
          type: string
        ticket:
          type: string
        message:
          type: string
        note:
          type: string
          description: Why it was skipped, canceled, unavailable or interrupted.
        spent_usd:
          type: number
          description: What its agent spent while running it (ADR-0013, point 2).

    ScheduleProposal:
      type: object
      required: [id, schedule, status, proposed_by, created_at]
      properties:
        id:
          type: string
          example: SP-2
        schedule:
          $ref: "#/components/schemas/Schedule"
        status:
          type: string
          enum: [proposed, accepted, refused]
        proposed_by:
          type: string
        proposal_message:
          type: string
          description: ID of the "propose" message sent to the human.
        refusal_reason:
          type: string
        warning:
          type: string
        created_at:
          type: string
          format: date-time
        decided_at:
          type: string
          format: date-time

    TicketStatus:
      type: string
      enum: [open, in_progress, done, canceled]

    Ticket:
      type: object
      required: [id, title, team, status, created_by, created_at, updated_at]
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        acceptance_criteria:
          type: string
        team:
          type: string
        feature:
          type: string
        assignee:
          type: string
        status:
          $ref: "#/components/schemas/TicketStatus"
        blocked_by:
          type: array
          items:
            type: string
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        archived:
          type: boolean
          description: The ticket of a finished feature, kept in the archives (read-only).
        budget_usd:
          type: number
          description: Absent when it has none.
        threshold:
          type: integer
          description: Percent of the budget at which its agent stops; absent means the project's threshold.
        spent_usd:
          type: number
          description: What was spent on it, all time, its askers' urgent forks included (ADR-0013, point 2).

    TicketDraft:
      type: object
      required: [title, team]
      additionalProperties: false
      properties:
        title:
          type: string
        team:
          type: string
        description:
          type: string
        acceptance_criteria:
          type: string
        blocked_by:
          type: array
          items:
            type: string
        assignee:
          type: string
        budget_usd:
          type: number
          exclusiveMinimum: 0
          description: Mandatory inside a feature that has a budget, and at most what it has left to allocate. Refused while budgets are turned off.
        threshold:
          $ref: "#/components/schemas/Threshold"

    TicketComment:
      type: object
      required: [id, ticket, author, body, created_at]
      properties:
        id:
          type: integer
        ticket:
          type: string
        author:
          type: string
        body:
          type: string
        created_at:
          type: string
          format: date-time

    Deliverable:
      type: object
      required: [id, ticket, author, kind, summary, created_at]
      properties:
        id:
          type: integer
        ticket:
          type: string
        author:
          type: string
        kind:
          type: string
          enum: [file, commit, report, note]
        reference:
          type: string
        summary:
          type: string
        created_at:
          type: string
          format: date-time

    TicketDetails:
      type: object
      required: [ticket, deliverables, comments, messages]
      properties:
        ticket:
          $ref: "#/components/schemas/Ticket"
        deliverables:
          type: array
          items:
            $ref: "#/components/schemas/Deliverable"
        comments:
          type: array
          items:
            $ref: "#/components/schemas/TicketComment"
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"

    Approval:
      type: object
      required: [id, agent, tool_name, created_at]
      properties:
        id:
          type: string
        agent:
          type: string
        tool_name:
          type: string
        tool_input:
          description: The tool's arguments, as sent by Claude Code.
          type: object
        suggestions:
          description: |
            The permission updates Claude Code offers with this prompt, as it
            sent them (`permission_suggestions`): `addRules` (always allow
            this command or tool), `setMode` (e.g. switch to `auto`),
            `addDirectories`… The human can allow the request together with one.
          type: array
          items:
            type: object
        created_at:
          type: string
          format: date-time

    Automation:
      type: object
      required: [level]
      additionalProperties: false
      properties:
        level:
          type: string
          enum: [off, auto]

    ApprovalDecision:
      type: object
      required: [decision]
      additionalProperties: false
      properties:
        decision:
          type: string
          enum: [allow, deny]
        message:
          description: Shown to the agent, typically to explain a refusal.
          type: string
        suggestion:
          description: |
            With an `allow`: the index, in the approval's `suggestions`, of the
            update to apply with it (always allow, switch mode…). Absent for
            a plain allow. An index out of range, or with a `deny`, is a 400.
          type: integer
          minimum: 0

    Threshold:
      type: integer
      minimum: 1
      maximum: 100
      description: Percent of a budget at which the agents it covers stop at the end of their turn.

    BudgetFields:
      type: object
      additionalProperties: false
      description: A ticket's or feature's budget; `budget_usd` null removes it.
      properties:
        budget_usd:
          type: [number, "null"]
          exclusiveMinimum: 0
        threshold:
          oneOf:
            - $ref: "#/components/schemas/Threshold"
            - type: "null"

    BudgetCap:
      type: object
      required: [limit_usd]
      additionalProperties: false
      description: An agent, team or staff cap in .nobody/budgets.yaml.
      properties:
        limit_usd:
          type: number
          exclusiveMinimum: 0
        monthly:
          type: boolean
          description: Starts again from 0 on the first day of each month; otherwise a cumulative cap.
        threshold:
          $ref: "#/components/schemas/Threshold"

    BudgetSettings:
      type: object
      required: [enabled, threshold]
      additionalProperties: false
      properties:
        enabled:
          type: boolean
          description: false turns caps, thresholds, holds, requests and budget fields off; spend is still measured.
        threshold:
          $ref: "#/components/schemas/Threshold"
        staff:
          $ref: "#/components/schemas/BudgetCap"
        teams:
          type: object
          description: Caps by team id.
          additionalProperties:
            $ref: "#/components/schemas/BudgetCap"
        agents:
          type: object
          description: Caps by agent address; the director has none.
          additionalProperties:
            $ref: "#/components/schemas/BudgetCap"

    BudgetScope:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [ticket, feature, agent, team, staff]
        id:
          type: string
          description: The ticket, feature, agent address or team id; empty for the staff.

    BudgetGauge:
      type: object
      required: [scope, limit_usd, spent_usd, threshold]
      description: Where one budget stands, over its own period.
      properties:
        scope:
          $ref: "#/components/schemas/BudgetScope"
        limit_usd:
          type: number
          description: The budget, extensions of the month included for a monthly cap.
        spent_usd:
          type: number
        threshold:
          type: integer
          description: The threshold that applies, the project's or the budget's own.
        monthly:
          type: boolean
        held:
          type: boolean
          description: The budget reached its threshold and holds its agents.

    SpendLine:
      type: object
      required: [key, spent_usd]
      properties:
        key:
          type: string
          description: Agent address, team id, feature id or schedule id.
        label:
          type: string
          description: The feature's or schedule's title.
        spent_usd:
          type: number

    SpendSummary:
      type: object
      required: [month, total_usd, agents, teams, features, schedules, gauges]
      properties:
        month:
          type: string
          example: 2026-11
        total_usd:
          type: number
          description: Everything spent in the month (the staff's spend).
        agents:
          type: array
          items:
            $ref: "#/components/schemas/SpendLine"
        teams:
          type: array
          items:
            $ref: "#/components/schemas/SpendLine"
        features:
          type: array
          items:
            $ref: "#/components/schemas/SpendLine"
        schedules:
          type: array
          items:
            $ref: "#/components/schemas/SpendLine"
        gauges:
          type: array
          description: Every budget that is set, with where it stands now (empty when budgets are turned off).
          items:
            $ref: "#/components/schemas/BudgetGauge"

    BudgetRequest:
      type: object
      required: [id, scope, status, active, held_agents, limit_usd, spent_usd, created_at]
      description: |
        One request per budget at its threshold (ADR-0013, point 5), active
        while the budget stays reached.
        `awaiting_agent`: the first agent to stop is asked to justify it
        (ticket, agent, team budgets); `awaiting_director`: the director is to
        give its opinion, or for a staff or feature budget its justification;
        `awaiting_human`: the director submitted it, a card waits in its
        chat; then `extended`, `refused`, or `closed` (monthly reset, budgets
        turned off, the budget removed).
      properties:
        id:
          type: string
          example: BR-4
        scope:
          $ref: "#/components/schemas/BudgetScope"
        status:
          type: string
          enum: [awaiting_agent, awaiting_director, awaiting_human, extended, refused, closed]
        active:
          type: boolean
          description: Its budget is still reached; at most one request per budget is active.
        held_agents:
          type: array
          description: The agents its budget holds now (empty once it is no longer active).
          items:
            type: string
        asked_agent:
          type: string
          description: The agent asked to justify it, the first to stop.
        requested_by:
          type: string
          description: The agent that justified it, or the director for a staff or feature budget.
        amount_usd:
          type: number
          description: The amount asked.
        justification:
          type: string
          description: Empty when the agent stopped without calling budget_request.
        director_opinion:
          type: string
        recommended_usd:
          type: number
          description: The amount the director recommends.
        limit_usd:
          type: number
        spent_usd:
          type: number
        feature_remaining_usd:
          type: number
          description: For a ticket inside a feature with a budget, what the feature has left to allocate.
        card_message:
          type: string
          description: ID of the director's message to the human that carries the card.
        extended_usd:
          type: number
        refusal:
          $ref: "#/components/schemas/BudgetRefusal"
        closed_reason:
          type: string
        created_at:
          type: string
          format: date-time
        submitted_at:
          type: string
          format: date-time
        decided_at:
          type: string
          format: date-time

    BudgetRefusal:
      type: object
      required: [outcomes]
      additionalProperties: false
      properties:
        outcomes:
          type: object
          description: An outcome for every held agent, by address.
          additionalProperties:
            type: string
            enum: [cancel, release, hold]
        commit_first:
          type: boolean
        reason:
          type: string

    BudgetProposal:
      type: object
      required: [id, scope, cap, status, proposed_by, created_at]
      properties:
        id:
          type: string
          example: BP-1
        scope:
          $ref: "#/components/schemas/BudgetScope"
        cap:
          $ref: "#/components/schemas/BudgetCap"
        reason:
          type: string
          description: Why the director proposes it.
        status:
          type: string
          enum: [proposed, accepted, refused]
        proposed_by:
          type: string
        proposal_message:
          type: string
        refusal_reason:
          type: string
        created_at:
          type: string
          format: date-time
        decided_at:
          type: string
          format: date-time

    StatusLineReport:
      type: object
      description: The JSON Claude Code hands its statusLine; only these fields are used.
      required: [session_id, cost]
      properties:
        session_id:
          type: string
        cost:
          type: object
          required: [total_cost_usd]
          properties:
            total_cost_usd:
              type: number
              description: The session's running total, Claude Code's estimate at list price.

    HookEvent:
      description: Event JSON as sent by Claude Code; only these fields are used.
      type: object
      required: [hook_event_name]
      properties:
        hook_event_name:
          type: string
        session_id:
          type: string
        cwd:
          type: string
        tool_name:
          type: string
        tool_input:
          type: object
        permission_suggestions:
          description: PermissionRequest only. Kept on the approval as `suggestions`.
          type: array
          items:
            type: object
        stop_hook_active:
          type: boolean
        source:
          type: string
          description: SessionStart only (startup, resume, clear or compact).

    HookDecision:
      type: object
      required: [message_ids]
      properties:
        response:
          description: JSON to print on stdout for Claude Code; absent when there is nothing to say.
          type: object
        message_ids:
          type: array
          items:
            type: string

    HookAck:
      type: object
      required: [message_ids]
      properties:
        message_ids:
          type: array
          items:
            type: string
