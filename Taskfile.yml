version: "3"

vars:
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev

tasks:
  default:
    cmds:
      - task --list

  build:
    desc: Build the daemon binary into bin/
    cmds:
      - go build -ldflags "-X main.version={{.VERSION}}" -o bin/nobodyd ./cmd/nobodyd
      - go build -o bin/nobody-hook ./cmd/nobody-hook

  test:
    desc: Run Go tests
    cmds:
      - go test -race ./...

  lint:
    desc: Lint Go and web code
    cmds:
      - go vet ./...
      - golangci-lint run
      - pnpm --dir web exec next typegen
      - pnpm --dir web exec tsc --noEmit
      - pnpm --dir web lint

  contract:
    desc: Check Claude Code behaviours we rely on, against the real CLI (costs a few cents)
    cmds:
      - go test -tags contract -count=1 -timeout 15m -v ./test/contract/...

  web:install:
    desc: Install web dependencies
    cmds:
      - pnpm --dir web install

  web:export:
    desc: Export the control room as a static site and embed it in the binaries (internal/webui, ADR-0016)
    cmds:
      - NOBODY_WEB_EXPORT=1 pnpm --dir web exec next build
      - find internal/webui/dist -mindepth 1 ! -name README.md -delete
      - cp -R web/out/. internal/webui/dist/

  dev:daemon:
    desc: Build and run the launcher; projects are opened from the control room (ARGS="-start=false" starts no agent)
    deps: [build]
    cmds:
      - ./bin/nobodyd {{.ARGS}}

  dev:web:
    desc: Run the Next.js dev server
    cmds:
      - pnpm --dir web dev

  check:
    desc: Everything that must pass before a commit
    cmds:
      - task: lint
      - task: test

  # The desktop app (ADR-0016, docs/desktop.md): its own Go module, desktop/.
  desktop:binaries:
    desc: Build the desktop app and the binaries it ships with into desktop/build/bin/
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    cmds:
      - go build -ldflags "-X main.version={{.VERSION}}" -o desktop/build/bin/nobodyd ./cmd/nobodyd
      - go build -o desktop/build/bin/nobody-hook ./cmd/nobody-hook
      - cd desktop && go build -ldflags "-X main.version={{.VERSION}}" -o build/bin/nobody-desktop .

  desktop:run:
    desc: Run the desktop app from desktop/build/bin/ (task web:export first for the control room; ARGS="-claude <built test/fakeclaude>" for free agents)
    deps: [desktop:binaries]
    cmds:
      - desktop/build/bin/nobody-desktop {{.ARGS}}

  desktop:build:
    desc: Export the control room and assemble desktop/build/bin/Nobody Inc.app (macOS)
    vars:
      APP: desktop/build/bin/Nobody Inc.app
    cmds:
      - task: web:export
      - task: desktop:binaries
      - rm -rf "{{.APP}}"
      - mkdir -p "{{.APP}}/Contents/MacOS"
      - cp desktop/build/bin/nobody-desktop desktop/build/bin/nobodyd desktop/build/bin/nobody-hook "{{.APP}}/Contents/MacOS/"
      - sed "s/VERSION/{{.VERSION}}/g" desktop/build/darwin/Info.plist > "{{.APP}}/Contents/Info.plist"

  desktop:check:
    desc: Lint and test the desktop app's module
    dir: desktop
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    cmds:
      - go vet ./...
      - golangci-lint run --config ../.golangci.yml
      - go test ./...
